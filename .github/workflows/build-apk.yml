name: ساخت APK داشبورد فارسی

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v6

      - name: تنظیم Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تنظیم Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ساخت APK
        env:
          AERODATABOX_RAPIDAPI_KEY_1: ${{ secrets.AERODATABOX_RAPIDAPI_KEY_1 }}
          AERODATABOX_RAPIDAPI_KEY_2: ${{ secrets.AERODATABOX_RAPIDAPI_KEY_2 }}
          AERODATABOX_RAPIDAPI_KEY_3: ${{ secrets.AERODATABOX_RAPIDAPI_KEY_3 }}
        run: gradle --no-daemon :app:assembleDebug

      - name: انتشار APK به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-farsi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: انتشار APK در Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dashboard-farsi.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dashboard-farsi.apk --title "آخرین نسخه" --notes "ساخت خودکار" --target ${{ github.sha }}

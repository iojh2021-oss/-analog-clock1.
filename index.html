<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ساعت آنالوگ</title>
<meta name="theme-color" content="#12141a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 35%, #1c1f29 0%, #0c0d12 75%);
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  #dateLabel {
    color: #b9a06a; font-size: 14px; letter-spacing: 3px; opacity: 0.75;
    text-transform: uppercase;
  }
  canvas { touch-action: none; }
  #digital {
    color: #e9e2cf; font-size: 15px; letter-spacing: 2px; opacity: 0.55;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="dateLabel"></div>
    <canvas id="clock" width="360" height="360"></canvas>
    <div id="digital"></div>
  </div>

<script>
const canvas = document.getElementById('clock');
const ctx = canvas.getContext('2d');
const size = canvas.width;
const center = size / 2;
const radius = size * 0.46;

const dateLabel = document.getElementById('dateLabel');
const digital = document.getElementById('digital');

const faLocale = 'fa-IR';

function drawFace() {
  ctx.clearRect(0, 0, size, size);

  // Outer rim gradient
  const rimGrad = ctx.createRadialGradient(center, center, radius * 0.9, center, center, radius * 1.05);
  rimGrad.addColorStop(0, '#2a2d38');
  rimGrad.addColorStop(1, '#0b0c10');
  ctx.beginPath();
  ctx.arc(center, center, radius * 1.03, 0, Math.PI * 2);
  ctx.fillStyle = rimGrad;
  ctx.fill();

  // Face
  ctx.beginPath();
  ctx.arc(center, center, radius, 0, Math.PI * 2);
  ctx.fillStyle = '#171922';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#3a3f4d';
  ctx.stroke();

  // Hour ticks + numerals
  for (let i = 0; i < 60; i++) {
    const angle = (i * Math.PI) / 30;
    const isHour = i % 5 === 0;
    const tickLen = isHour ? radius * 0.12 : radius * 0.05;
    const outer = radius * 0.92;
    const x1 = center + Math.cos(angle - Math.PI / 2) * outer;
    const y1 = center + Math.sin(angle - Math.PI / 2) * outer;
    const x2 = center + Math.cos(angle - Math.PI / 2) * (outer - tickLen);
    const y2 = center + Math.sin(angle - Math.PI / 2) * (outer - tickLen);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineWidth = isHour ? 3 : 1;
    ctx.strokeStyle = isHour ? '#c9a768' : '#4d5261';
    ctx.stroke();
  }

  // Numerals
  ctx.font = `600 ${radius * 0.16}px Georgia, serif`;
  ctx.fillStyle = '#e9e2cf';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let n = 1; n <= 12; n++) {
    const angle = (n * Math.PI) / 6 - Math.PI / 2;
    const nx = center + Math.cos(angle) * radius * 0.76;
    const ny = center + Math.sin(angle) * radius * 0.76;
    ctx.fillText(n.toString(), nx, ny);
  }

  // Center brand dot placeholder ring
  ctx.beginPath();
  ctx.arc(center, center, radius * 0.5, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(201,167,104,0.15)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawHand(angle, length, width, color, cap = 'round') {
  ctx.save();
  ctx.translate(center, center);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.lineCap = cap;
  ctx.moveTo(0, length * 0.15);
  ctx.lineTo(0, -length);
  ctx.lineWidth = width;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.restore();
}

function render() {
  const now = new Date();
  const ms = now.getMilliseconds();
  const s = now.getSeconds() + ms / 1000;
  const m = now.getMinutes() + s / 60;
  const h = (now.getHours() % 12) + m / 60;

  drawFace();

  const hourAngle = (h * Math.PI) / 6;
  const minAngle = (m * Math.PI) / 30;
  const secAngle = (s * Math.PI) / 30;

  drawHand(hourAngle, radius * 0.5, 6, '#e9e2cf');
  drawHand(minAngle, radius * 0.72, 4, '#e9e2cf');
  drawHand(secAngle, radius * 0.8, 2, '#c9a768');

  // Center pin
  ctx.beginPath();
  ctx.arc(center, center, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#c9a768';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(center, center, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = '#171922';
  ctx.fill();

  dateLabel.textContent = now.toLocaleDateString(faLocale, { weekday: 'long', day: 'numeric', month: 'long' });
  digital.textContent = now.toLocaleTimeString(faLocale, { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  requestAnimationFrame(render);
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
